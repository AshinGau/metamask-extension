name: Upload extension to Firefox AMO

# Uploads metamask-firefox-{version}.zip from a GitHub Release to Mozilla AMO by invoking the
# amo-submission Lambda (us-east-2). The runner never downloads the zip or AMO credentials;
# the Lambda fetches the release asset, mints the AMO JWT, and submits the upload.
#
# Trigger: workflow_dispatch from refs/heads/main. Production jobs use GitHub environment
# amo-production
#
# OIDC trust (Terraform: va-mmc-extension-submission-infra):
#
#   1. permissions.id-token: write lets the job request a GitHub OIDC JWT.
#   2. environment: amo-production scopes the token sub claim to
#      repo:MetaMask/metamask-extension:environment:amo-production.
#   3. aws-actions/configure-aws-credentials calls sts:AssumeRoleWithWebIdentity on the
#      account GitHub OIDC provider, assuming IAM role amo-submission-production (PRD).
#   4. That role's trust policy requires all of:
#        token.actions.githubusercontent.com:aud            = sts.amazonaws.com
#        token.actions.githubusercontent.com:sub            = repo:MetaMask/metamask-extension:environment:amo-production
#        token.actions.githubusercontent.com:ref              = refs/heads/main
#        token.actions.githubusercontent.com:job_workflow_ref = MetaMask/metamask-extension/.github/workflows/upload-extension-to-amo.yml@refs/heads/main
#        token.actions.githubusercontent.com:actor          = runway-github[bot]
#        token.actions.githubusercontent.com:actor_id         = 73448015
#   5. The role policy allows only lambda:InvokeFunction on function amo-submission.
#      AMO API credentials live in Secrets Manager and are read by the Lambda execution role,
#      not by this workflow or its assumed IAM role.
#
# Beta (UAT) follows the same OIDC pattern with amo-submission-beta and environment amo-beta;
# trust requires main + this workflow file on main but does not pin actor.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 13.12.0) — must match GitHub Release tag v{version}"
        required: true
        type: string
      target:
        description: "AMO listing target"
        required: true
        type: choice
        default: beta
        options:
          - beta
          - production
      expected_sha256:
        description: "Optional SHA-256 of metamask-firefox-{version}.zip (64 lowercase hex). Omit to use release digest / SHA256SUMS when available."
        required: false
        type: string
      asset_name:
        description: "Optional release asset filename (default metamask-firefox-{version}.zip)"
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  upload:
    name: Upload to AMO (${{ inputs.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.target }}
      cancel-in-progress: false
    environment: ${{ inputs.target == 'production' && 'amo-production' || inputs.target == 'beta' && 'amo-beta' || null }}
    env:
      VERSION: ${{ inputs.version }}
      RELEASE_TAG: v${{ inputs.version }}
      ZIP_NAME: metamask-firefox-${{ inputs.version }}.zip
      AWS_REGION: us-east-2
      LAMBDA_NAME: amo-submission
    steps:
      - name: Validate inputs and configuration
        env:
          TARGET: ${{ inputs.target }}
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
          ASSET_NAME: ${{ inputs.asset_name }}
          ROLE_ARN_BETA: ${{ vars.AMO_ROLE_ARN_BETA }}
          ROLE_ARN_PROD: ${{ vars.AMO_ROLE_ARN }}
          ADDON_GUID_BETA: ${{ vars.AMO_ADDON_GUID_BETA }}
          ADDON_GUID_PROD: ${{ vars.AMO_ADDON_GUID }}
        run: |
          set -euo pipefail
          if [[ "${{ github.ref }}" != "refs/heads/main" ]]; then
            echo "::error::This workflow must run from refs/heads/main (current: ${{ github.ref }})"
            exit 1
          fi
          if [[ ! "${VERSION}" =~ ^[0-9]+(\.[0-9]+){0,3}$ ]]; then
            echo "::error::Invalid version format: ${VERSION} — use 1–4 dot-separated integers (e.g. 13.12.0)"
            exit 1
          fi
          IFS='.' read -r -a version_parts <<< "${VERSION}"
          for part in "${version_parts[@]}"; do
            if [[ ! "${part}" =~ ^(0|[1-9][0-9]*)$ ]]; then
              echo "::error::Version segment must be a non-negative integer without leading zeros: ${part} in ${VERSION}"
              exit 1
            fi
          done
          if [[ -n "${EXPECTED_SHA256}" && ! "${EXPECTED_SHA256}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::expected_sha256 must be 64 lowercase hex characters"
            exit 1
          fi
          if [[ "${TARGET}" == "beta" ]]; then
            ROLE_ARN="${ROLE_ARN_BETA}"
            ADDON_GUID="${ADDON_GUID_BETA}"
            DEPLOYMENT_ENV="beta"
          elif [[ "${TARGET}" == "production" ]]; then
            ROLE_ARN="${ROLE_ARN_PROD}"
            ADDON_GUID="${ADDON_GUID_PROD}"
            DEPLOYMENT_ENV="production"
          else
            echo "::error::Invalid target: ${TARGET}"
            exit 1
          fi
          if [[ -z "${ROLE_ARN:-}" ]]; then
            echo "::error::Missing repository variable AMO_ROLE_ARN for target '${TARGET}' (use AMO_ROLE_ARN_BETA for beta, AMO_ROLE_ARN for production)"
            exit 1
          fi
          if [[ -z "${ADDON_GUID:-}" ]]; then
            echo "::error::Missing repository variable AMO_ADDON_GUID for target '${TARGET}' (use AMO_ADDON_GUID_BETA for beta, AMO_ADDON_GUID for production)"
            exit 1
          fi
          {
            echo "ROLE_ARN=${ROLE_ARN}"
            echo "ADDON_GUID=${ADDON_GUID}"
            echo "DEPLOYMENT_ENV=${DEPLOYMENT_ENV}"
          } >> "${GITHUB_ENV}"
          if [[ -n "${EXPECTED_SHA256}" ]]; then
            echo "EXPECTED_SHA256=${EXPECTED_SHA256}" >> "${GITHUB_ENV}"
          fi
          if [[ -n "${ASSET_NAME}" ]]; then
            echo "ASSET_NAME=${ASSET_NAME}" >> "${GITHUB_ENV}"
          else
            echo "ASSET_NAME=${ZIP_NAME}" >> "${GITHUB_ENV}"
          fi
          {
            echo "## AMO upload"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Target | \`${TARGET}\` |"
            echo "| Version | \`${VERSION}\` |"
            echo "| Release tag | \`${RELEASE_TAG}\` |"
            echo "| Asset | \`${ASSET_NAME:-${ZIP_NAME}}\` |"
            echo "| Lambda | \`${LAMBDA_NAME}\` |"
            echo "| AWS region | \`${AWS_REGION}\` |"
            echo "| Deployment env | \`${DEPLOYMENT_ENV}\` |"
            echo "| Branch | \`${{ github.ref }}\` |"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6.1.2
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: amo-${{ inputs.target }}-${{ github.run_id }}

      - name: Submit AMO upload via Lambda invoke (B1)
        id: amo-upload
        run: |
          set -euo pipefail
          PAYLOAD="$(jq -n \
            --arg environment "${DEPLOYMENT_ENV}" \
            --arg run_id "${{ github.run_id }}" \
            --arg version "${VERSION}" \
            --arg amo_addon_guid "${ADDON_GUID}" \
            --arg expected_sha256 "${EXPECTED_SHA256:-}" \
            --arg asset_name "${ASSET_NAME}" \
            '{
              environment: $environment,
              run_id: $run_id,
              version: $version,
              amo_addon_guid: $amo_addon_guid,
              asset_name: $asset_name
            }
            + (if $expected_sha256 != "" then {expected_sha256: $expected_sha256} else {} end)')"

          INVOKE_RESULT=0
          aws lambda invoke \
            --function-name "${LAMBDA_NAME}" \
            --invocation-type RequestResponse \
            --cli-binary-format raw-in-base64-out \
            --payload "${PAYLOAD}" \
            /tmp/amo-response.json || INVOKE_RESULT=$?

          if [[ "${INVOKE_RESULT}" -ne 0 ]]; then
            echo "::error::aws lambda invoke failed (exit ${INVOKE_RESULT})"
            exit "${INVOKE_RESULT}"
          fi

          if jq -e '.errorMessage // empty' /tmp/amo-response.json >/dev/null; then
            ERR_TYPE="$(jq -r '.errorType // "LambdaError"' /tmp/amo-response.json)"
            ERR_MSG="$(jq -r '.errorMessage // "unknown"' /tmp/amo-response.json | head -c 500)"
            echo "::error::Lambda runtime error (${ERR_TYPE}): ${ERR_MSG}"
            echo "AMO_UPLOAD_FAILED=true" >> "${GITHUB_ENV}"
            echo "AMO_UPLOAD_ERROR=${ERR_TYPE}: ${ERR_MSG}" >> "${GITHUB_ENV}"
            exit 1
          fi

          if jq -e '.error // empty' /tmp/amo-response.json >/dev/null; then
            ERR_CODE="$(jq -r '.error // "unknown"' /tmp/amo-response.json)"
            ERR_MSG="$(jq -r '.message // "no message"' /tmp/amo-response.json | head -c 500)"
            echo "::error::Lambda returned error (${ERR_CODE}): ${ERR_MSG}"
            echo "AMO_UPLOAD_FAILED=true" >> "${GITHUB_ENV}"
            echo "AMO_UPLOAD_ERROR=${ERR_CODE}: ${ERR_MSG}" >> "${GITHUB_ENV}"
            exit 1
          fi

          STATUS="$(jq -r '.status // empty' /tmp/amo-response.json)"
          if [[ "${STATUS}" != "submitted" ]]; then
            echo "::error::Unexpected Lambda response (status=${STATUS:-<empty>})"
            echo "AMO_UPLOAD_FAILED=true" >> "${GITHUB_ENV}"
            echo "AMO_UPLOAD_ERROR=unexpected status: ${STATUS:-<empty>}" >> "${GITHUB_ENV}"
            exit 1
          fi

          {
            echo "upload_uuid=$(jq -r '.upload_uuid // ""' /tmp/amo-response.json)"
            echo "amo_version_id=$(jq -r '.amo_version_id // ""' /tmp/amo-response.json)"
            echo "amo_version_url=$(jq -r '.amo_version_url // ""' /tmp/amo-response.json)"
            echo "attestation_verified=$(jq -r '.attestation_verified // false' /tmp/amo-response.json)"
          } >> "${GITHUB_OUTPUT}"

          echo "AMO_UPLOAD_FAILED=false" >> "${GITHUB_ENV}"

          {
            echo "### AMO submission accepted"
            echo ""
            echo "- Version: \`${VERSION}\`"
            echo "- Target: \`${{ inputs.target }}\`"
            echo "- Upload UUID: \`$(jq -r '.upload_uuid // "n/a"' /tmp/amo-response.json)\`"
            echo "- AMO Version ID: \`$(jq -r '.amo_version_id // "n/a"' /tmp/amo-response.json)\`"
            echo "- AMO Version URL: $(jq -r '.amo_version_url // "n/a"' /tmp/amo-response.json)"
            echo "- Attestation verified: \`$(jq -r '.attestation_verified // false' /tmp/amo-response.json)\`"
          } >> "${GITHUB_STEP_SUMMARY}"

          rm -f /tmp/amo-response.json

      - name: Summary
        if: always()
        run: |
          {
            echo ""
            echo "### Result"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Target | \`${{ inputs.target }}\` |"
            echo "| Version | \`${{ inputs.version }}\` |"
            echo "| Branch | \`${{ github.ref }}\` |"
            echo "| Upload step | \`${{ steps.amo-upload.outcome }}\` |"
            echo "| Upload UUID | \`${{ steps.amo-upload.outputs.upload_uuid || 'n/a' }}\` |"
            echo "| AMO version ID | \`${{ steps.amo-upload.outputs.amo_version_id || 'n/a' }}\` |"
            echo "| Attestation verified | \`${{ steps.amo-upload.outputs.attestation_verified || 'n/a' }}\` |"
            echo "| Workflow run | ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} |"
          } >> "${GITHUB_STEP_SUMMARY}"
          if [[ "${{ steps.amo-upload.outcome }}" == "failure" ]]; then
            echo ""
            echo "**Failure:** ${AMO_UPLOAD_ERROR:-see Submit AMO upload step logs (Lambda payload not printed)}"
            exit 1
          fi
